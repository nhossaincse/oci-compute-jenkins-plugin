name: CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Download OCI Java SDK
        run: curl -OL https://github.com/oracle/oci-java-sdk/archive/v2.46.0.tar.gz
      - name: Extract OCI Java SDK
        run: tar -xvf v2.46.0.tar.gz
      - name: Install OCI Java SDK
        run: pushd oci-java-sdk-2.46.0/ && mvn -q clean install && popd
      - name: Build with Maven
        run: mvn clean compile